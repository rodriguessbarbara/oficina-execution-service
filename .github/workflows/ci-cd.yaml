name: CI/CD - Execution Service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "21"

jobs:
  build-and-test:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build, testes e cobertura
        run: ./gradlew check jacocoTestReport --no-daemon --console=plain

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 7

      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon --console=plain

      - name: Avisar quando Sonar não estiver configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Configure o secret SONAR_TOKEN para habilitar a análise SonarQube Cloud."

  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    environment: producao
    env:
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'oficina-mvp-prod' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obter Account ID
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Criar repositório ECR se necessário
        run: |
          aws ecr describe-repositories --repository-names oficina-execution-service \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name oficina-execution-service \
            --region "$AWS_REGION"

      - name: Build e push da imagem
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/oficina-execution-service"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "IMAGE_URI=$IMAGE:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configurar kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name app-cluster-producao

      - name: Criar ou atualizar secrets
        env:
          DB_PASSWORD: ${{ secrets.EXECUTION_DB_PASSWORD }}
          CLOUDAMQP_URL: ${{ secrets.CLOUDAMQP_URL }}
        run: |
          kubectl create secret generic execution-service-secrets \
            --namespace="$K8S_NAMESPACE" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=CLOUDAMQP_URL="$CLOUDAMQP_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifests
        run: |
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/producao/configmap.yaml
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/base/service.yaml
          sed "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/base/deployment.yaml |
            kubectl -n "$K8S_NAMESPACE" apply -f -

      - name: Aguardar rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status deployment/execution-service --timeout=300s
