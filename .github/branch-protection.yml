# Estado desejado para a proteção da branch principal.
# Este arquivo é documentação versionada e não configura o GitHub automaticamente.
repository: rodriguessbarbara/oficina-execution-service
branch: main

protection:
  require_pull_request: true
  required_approving_review_count: 1
  dismiss_stale_reviews: true
  require_conversation_resolution: true
  require_status_checks: true
  require_branches_to_be_up_to_date: true
  required_status_checks:
    - "Build, testes e qualidade"
  enforce_for_administrators: true
  require_linear_history: true
  allow_force_pushes: false
  allow_deletions: false
