services:
  db-execution:
    image: postgres:16-alpine
    container_name: oficina-execution-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: oficina_execution_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - execution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_execution_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oficina-execution-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - execution_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  execution-service:
    build: .
    container_name: oficina-execution-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db-execution
      DB_PORT: 5432
      DB_NAME: oficina_execution_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      CLOUDAMQP_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      db-execution:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  execution_postgres_data:
  execution_rabbitmq_data:
